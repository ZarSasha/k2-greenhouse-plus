[mod-setting-description]
  #Translated with DeepL:
  k2gp-enable-tree-greenhouse-base-game=普通树木可在温室中培育.
  #Translated with DeepL:
  k2gp-enable-tree-greenhouse-space-age=普通树木可在温室中培育 (若行星表面条件适宜).
  k2gp-enable-main-gleba-greenhouses=玉玛果树 与 果冻茎株可以在温室中种植了. 配方可以设置为需要人造土或沃土.
  k2gp-enable-other-gleba-greenhouses=黏叠珊瑚 与 阳绵壳衣可以在句芒星上的温室中种植了.
  #Translated with DeepL:
  k2gp-enable-pyrolysis-recipes=启用在熔炉中将木材转化为煤矿. 原油处理技术使其能在化工厂中转化为煤炭原油和石油气.
  k2gp-unlock-coal-liquefaction-early=煤炭液化技术可在高级石油加工技术之后进行研究, 而且成本降低.
  #k2gp-greenhouse-module-slot-amount-base-game=
  k2gp-greenhouse-module-slot-amount-space-age=默认设置为 0, 因为种植的树木和农业塔无法受到模块的影响.
  k2gp-greenhouse-tree-output-pr-sec=产出木材. 无论产出量多少，污染减少量都保持不变 (~1.1 单位/分钟，或通常为锅炉燃烧木材排放量的 ~13.5%).
  k2gp-greenhouse-yumako-tree-output-pr-sec=产出玉玛果. 孢子的产生与产出率成正比 (默认设置下为 ~7.3 个单位/分钟，与正常植物生长非常接近).
  k2gp-greenhouse-jellystem-output-pr-sec=产出果冻果. 孢子的产生与产出率成正比 (默认设置下为 ~7.3 个单位/分钟，与正常植物生长非常接近).
  k2gp-greenhouse-slipstack-output-pr-sec=产出石矿和变质物. 不会造成任何污染.
  k2gp-greenhouse-sunnycomb-output-pr-sec=产出变质物. 不会造成任何污染.

