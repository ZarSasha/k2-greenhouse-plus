  k2gp-wood-distillation-enhanced=通过酶预处理和热解来分解木材. 木质素含量得以更高效地溶解, 从而实现了更高的液化程度.\n\n注: 虽然从技术上讲, 该方法不如木材蒸馏, 生物室带来的50%产量加成足以弥补这一不足. #Translated with DeepL
