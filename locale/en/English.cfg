[entity-description]
  k2gp-greenhouse-for-tree=Grows and harvests trees for their wood.
  k2gp-greenhouse-for-yumako-tree=Grows and harvests Yumako trees for their fruit.
  k2gp-greenhouse-for-jellystem=Grows and harvests Jellystems for their nuts.
  k2gp-greenhouse-for-slipstack=Grows and harvests Slipstacks for spoilage and stone.
  k2gp-greenhouse-for-sunnycomb=Grows and harvests Sunnycombs for spoilage.

