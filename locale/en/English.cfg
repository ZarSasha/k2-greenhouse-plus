  k2gp-enable-tree-greenhouse=Enable Nauvis tree greenhouse
  k2gp-enable-gleba-greenhouses=Enable Gleba greenhouses
  k2gp-provide-glass-for-greenhouses=Provide glass for greenhouses
  k2gp-enable-pyrolysis-recipes=Enable wood pyrolysis
  k2gp-unlock-coal-liquefaction-early=Unlock Coal Liquefaction early
  k2gp-greenhouse-module-slot-amount=Greenhouse module slot amount
  k2gp-allow-greenhouse-quality-scaling=Allow greenhouse quality scaling
  k2gp-greenhouse-tree-output-pr-sec=Nauvis tree greenhouse output/s
  k2gp-greenhouse-gleba-main-trees-output-pr-sec=Main Gleba greenhouses output/s
  k2gp-greenhouse-gleba-other-trees-output-pr-sec=Other Gleba greenhouses output/s

[mod-setting-description]
  k2gp-enable-tree-greenhouse-base-game=Normal trees may be grown in a greenhouse.
  k2gp-enable-tree-greenhouse-space-age=Normal trees may be grown in a greenhouse on any planet that has the right surface conditions for it.
  k2gp-enable-gleba-greenhouses=Several tree species of Gleba may be grown in their own greenhouses, but only on Gleba.
  k2gp-provide-glass-for-greenhouses=Provides glass for the greenhouses, either from this or other mods.
  k2gp-enable-pyrolysis-recipes=Provides recipes for converting wood into coal (carbonization) or a combination of coal, crude oil and petroleum gas (distillation).
  k2gp-unlock-coal-liquefaction-early=Coal Liquefaction technology may be researched right after Advanced Oil Processing, and at much lower cost.
  k2gp-allow-greenhouse-quality-scaling=Allows greenhouses of higher quality to receive a bonus to their output rate. Disabled by default since planted trees and agricultural towers can't benefit that way from quality.
  k2gp-greenhouse-module-slot-amount=Has been set to 0 by default since planted trees and agricultural towers in Space Age can't receive the effect of modules.
  k2gp-greenhouse-tree-output-pr-sec=Affects greenhouses for trees. Pollution absorption is proportional to output rate.
  k2gp-greenhouse-gleba-main-trees-output-pr-sec=Affects greenhouses for Yumako trees and Jellystems. Spore creation is proportional to output rate.
  k2gp-greenhouse-gleba-other-trees-output-pr-sec=Affects greenhouses for Slipstacks and Sunnycombs. They do not pollute in any way.

[string-mod-setting]
  k2gp-enable-gleba-greenhouses-all=All variants
  k2gp-enable-gleba-greenhouses-main=Yumako + Jellynut
  k2gp-enable-gleba-greenhouses-other=Slipstack + Sunnycomb
  k2gp-enable-gleba-greenhouses-disabled=Disabled
  k2gp-provide-glass-for-greenhouses-default=Default [img=info]
  k2gp-provide-glass-for-greenhouses-other=Other mods [img=info]
  k2gp-provide-glass-for-greenhouses-disabled=Disabled [img=info]
  k2gp-enable-pyrolysis-recipes-both-recipes=Both recipe types
  k2gp-enable-pyrolysis-recipes-carbonization=Carbonization
  k2gp-enable-pyrolysis-recipes-distillation=Distillation
  k2gp-enable-pyrolysis-recipes-disabled=Disabled

[string-mod-setting-description]
  k2gp-provide-glass-for-greenhouses-default=Specialised greenhouse glass is provided by the mod itself.
  k2gp-provide-glass-for-greenhouses-other=One compatible mod provides glass for the greenhouses. Smaller mods are automatically prioritized, iron plates are used as a fallback.
  k2gp-provide-glass-for-greenhouses-disabled=Glass for the greenhouses is disabled, iron plates are used instead.
