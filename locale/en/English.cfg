[technology-description]
  k2gp-greenhouse-tech-base-game=Automatically grow and harvest trees in a greenhouse.
  k2gp-greenhouse-tech-space-age=Extract seeds from wood, automatically grow and harvest trees in a greenhouse.

[mod-setting-name]
  k2gp-enable-tree-greenhouse=Enable tree greenhouse
  k2gp-enable-main-gleba-greenhouses=Enable main Gleba greenhouses
  k2gp-enable-other-gleba-greenhouses=Enable other Gleba greenhouses
  k2gp-provide-glass-for-greenhouses=Provide glass for greenhouses
  k2gp-enable-pyrolysis-recipes=Enable wood pyrolysis
  k2gp-unlock-coal-liquefaction-early=Unlock Coal Liquefaction early
  k2gp-greenhouse-module-slot-amount=Greenhouse module slot amount
  k2gp-greenhouse-tree-output-pr-sec=Greenhouse normal trees: wood/sec.
  k2gp-greenhouse-yumako-tree-output-pr-sec=Greenhouse Yumako trees: fruits/sec.
  k2gp-greenhouse-jellystem-output-pr-sec=Greenhouse Jellystems: nuts/sec.
  k2gp-greenhouse-slipstack-output-pr-sec=Greenhouse Slipstacks: output/sec.
  k2gp-greenhouse-sunnycomb-output-pr-sec=Greenhouse Sunnycombs: spoilage/sec.

[mod-setting-description]
  k2gp-enable-tree-greenhouse-base-game=Normal trees may be grown in a greenhouse.
  k2gp-enable-tree-greenhouse-space-age=Normal trees may be grown in a greenhouse on any planet that has the right surface conditions.
  k2gp-enable-main-gleba-greenhouses=Yumako trees and Jellystems may be grown in their own greenhouses. Their recipes can be set to require overgrowth soil or just artificial soil.
  k2gp-enable-other-gleba-greenhouses=Slipstacks and Sunnycombs may be grown in their own greenhouses on Gleba.
  k2gp-provide-glass-for-greenhouses=Lets the mod provide recipes for turning stone into sand, and sand into glass, which will replace iron plates as an ingredient for the greenhouses.
  k2gp-enable-pyrolysis-recipes=Provides recipes for converting wood into coal (carbonization) or a combination of coal, crude oil and petroleum gas (distillation).
  k2gp-unlock-coal-liquefaction-early=Coal Liquefaction technology may be researched right after Advanced Oil Processing, and at much lower cost.
  #k2gp-greenhouse-module-slot-amount-base-game=
  k2gp-greenhouse-module-slot-amount-space-age=Has been set to 0 by default since planted trees and agricultural towers can't receive the effect of modules.
  k2gp-greenhouse-tree-output-pr-sec=Outputs wood. Pollution absorption is proportional to output rate (2.25 units/min. at default setting; if the wood is burned in a boiler, ~27% of the pollution may be re-absorbed).
  k2gp-greenhouse-yumako-tree-output-pr-sec=Outputs yumako fruit. Spore creation is proportional to output rate (~6.9 units/min. at default setting, closely approximating that from normal plant growth).
  k2gp-greenhouse-jellystem-output-pr-sec=Outputs jellynuts. Spore creation is proportional to output rate (~6.9 units/min. at default setting, closely approximating that from normal plant growth).
  k2gp-greenhouse-slipstack-output-pr-sec=Outputs spoilage and stone. Does not pollute in any way.
  k2gp-greenhouse-sunnycomb-output-pr-sec=Outputs spoilage. Does not pollute in any way.

[string-mod-setting]
  k2gp-enable-main-gleba-greenhouses-with-overgrowth-soil=With overgrowth soil
  k2gp-enable-main-gleba-greenhouses-with-artificial-soil=With artificial soil
  k2gp-enable-main-gleba-greenhouses-disabled=Disabled
  k2gp-enable-pyrolysis-recipes-both-recipes=Both recipe types
  k2gp-enable-pyrolysis-recipes-carbonization=Carbonization
  k2gp-enable-pyrolysis-recipes-distillation=Distillation
  k2gp-enable-pyrolysis-recipes-disabled=Disabled
