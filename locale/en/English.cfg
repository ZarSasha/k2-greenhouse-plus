[mod-setting-description]
  k2gp-enable-tree-greenhouse-base-game=Normal trees may be grown in a greenhouse.
  k2gp-enable-tree-greenhouse-space-age=Normal trees may be grown in a greenhouse on any planet that has the right surface conditions.
  k2gp-enable-main-gleba-greenhouses=Yumako trees and Jellystems may be grown in their own greenhouses. Their recipes can be set to require overgrowth soil or just artificial soil.
  k2gp-enable-other-gleba-greenhouses=Slipstacks and Sunnycombs may be grown in their own greenhouses on Gleba.
  k2gp-enable-pyrolysis-recipes=Allows the conversion of wood into coal in a furnace. Oil Processing technology allows it to be converted into coal, oil and petroleum gas in a chemical plant.
  k2gp-unlock-coal-liquefaction-early=Coal Liquefaction technology may be researched right after Advanced Oil Processing, and at much lower cost.
  #k2gp-greenhouse-module-slot-amount-base-game=
  k2gp-greenhouse-module-slot-amount-space-age=Has been set to 0 by default since planted trees and agricultural towers can't receive the effect of modules.
  k2gp-greenhouse-tree-output-pr-sec=Outputs wood. Pollution reduction remains the same regardless of output (~1.1 units/min. or normally ~13.5% of what is emitted by burning the wood in a Boiler).
  k2gp-greenhouse-yumako-tree-output-pr-sec=Outputs yumako fruit. Spore creation is proportional to output rate (~7.3 units/min. at default setting, closely approximating that from normal plant growth).
  k2gp-greenhouse-jellystem-output-pr-sec=Outputs jellynuts. Spore creation is proportional to output rate (~7.3 units/min. at default setting, closely approximating that from normal plant growth).
  k2gp-greenhouse-slipstack-output-pr-sec=Outputs spoilage and stone. Does not pollute in any way.
  k2gp-greenhouse-sunnycomb-output-pr-sec=Outputs spoilage. Does not pollute in any way.

[string-mod-setting]
  k2gp-enable-main-gleba-greenhouses-with-overgrowth-soil=With overgrowth soil
  k2gp-enable-main-gleba-greenhouses-with-artificial-soil=With artificial soil
  k2gp-enable-main-gleba-greenhouses-disabled=Disabled
  k2gp-enable-pyrolysis-recipes-both-recipes=Both recipes
  k2gp-enable-pyrolysis-recipes-basic-recipe=Basic recipe
  k2gp-enable-pyrolysis-recipes-advanced-recipe=Advanced recipe
  k2gp-enable-pyrolysis-recipes-disabled=Disabled